<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таверна "Крипер & Котел" | Меню Minecraft</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=MedievalSharp&display=swap');

        :root {
            --parchment-bg: #e6c894;
            --parchment-dark: #cfa86b;
            --border-color: #4a2e13;
            --text-dark: #2c1a0c;
            --accent-gold: #b57a1d;
            --mc-dark: #1e1e1e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0d0a07;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(20, 15, 10, 0.8), rgba(5, 5, 5, 0.95)),
                repeating-linear-gradient(45deg, #140f0a 0, #140f0a 10px, #0d0a07 10px, #0d0a07 20px);
            color: var(--text-dark);
            font-family: 'MedievalSharp', cursive, serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Обертка пергамента */
        .parchment-wrapper {
            position: relative;
            max-width: 900px;
            width: 100%;
            margin: 20px auto;
            background-color: var(--parchment-bg);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.1) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(74, 46, 19, 0.03) 3px, rgba(74, 46, 19, 0.03) 4px);
            border: 8px solid var(--border-color);
            box-shadow: 
                0 0 0 4px #2a1808,
                0 15px 35px rgba(0, 0, 0, 0.8),
                inset 0 0 80px rgba(74, 46, 19, 0.5);
            padding: 40px;
            border-radius: 4px;
        }

        /* Декоративные уголки */
        .corner {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 4px solid var(--border-color);
        }
        .corner-tl { top: 6px; left: 6px; border-right: none; border-bottom: none; }
        .corner-tr { top: 6px; right: 6px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 6px; left: 6px; border-right: none; border-top: none; }
        .corner-br { bottom: 6px; right: 6px; border-left: none; border-top: none; }

        /* Шапка */
        header {
            text-align: center;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.6rem;
            color: #3b220c;
            text-shadow: 2px 2px 0px var(--parchment-dark);
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #5c3a19;
            font-style: italic;
        }

        /* Вкладки категорий */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(74, 46, 19, 0.3);
            padding-bottom: 15px;
        }

        .tab-btn {
            background: #d4b075;
            border: 3px solid var(--border-color);
            padding: 10px 18px;
            font-family: 'MedievalSharp', cursive;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--text-dark);
            cursor: pointer;
            box-shadow: 2px 2px 0 #2a1808;
            transition: all 0.1s ease;
        }

        .tab-btn:hover {
            background: #e8c68c;
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: var(--border-color);
            color: #f7e5c4;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
        }

        /* Сетка блюд */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 20px;
        }

        .menu-card {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid var(--border-color);
            border-radius: 4px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 15px rgba(116, 75, 36, 0.15), 3px 3px 0 rgba(0, 0, 0, 0.15);
            position: relative;
            transition: transform 0.2s;
        }

        .menu-card:hover {
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Контейнер и настройки для текстур 16х16 */
        .item-image-wrapper {
            width: 140px;
            height: 140px;
            background: rgba(74, 46, 19, 0.08);
            border: 2px dashed var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        /* Оптимизация вывода пикселей */
        .pixel-art {
            width: 128px;
            height: 128px;
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-crisp-edges;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .item-title {
            font-size: 1.3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            color: #2c1a0c;
        }

        .item-price {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            color: #2a1808;
            background: rgba(181, 122, 29, 0.25);
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: auto;
        }

        .currency-icon {
            width: 24px;
            height: 24px;
            image-rendering: pixelated;
        }

        /* Футер */
        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.9rem;
            color: #5c3a19;
            border-top: 1px dashed var(--border-color);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="parchment-wrapper">
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <header>
            <h1>РЕСТОРАН "АТДАЙ САЛО"</h1>
            <div class="subtitle">~ Холод снаружи — сало внутри ~</div>
        </header>

        <!-- Вкладки категорий -->
        <div class="category-tabs" id="tabs-container">
            <button class="tab-btn active" onclick="switchCategory('soups')">🍲 Супы</button>
        </div>

        <!-- Контейнер для блюд -->
        <div class="menu-grid" id="menu-container"></div>

        <footer>
            Принимаем к оплате только порох. Сало бесплатно не отдаём!
        </footer>
    </div>

    <script>
        const menuData = [
            { id: 1, name: "Борщ", category: "soups", price: "2 пороха", image: "assets/borscht.png" },
            { id: 2, name: "Сливочно-луковый суп", category: "soups", price: "3 пороха", image: "assets/creamy_onion.png" },
            { id: 3, name: "Куриный суп", category: "soups", price: "3 пороха", image: "assets/chicken_soup.png" },
            { id: 4, name: "Овощной суп", category: "soups", price: "2 пороха", image: "assets/vegetable_soup.png" },
            { id: 5, name: "Тыквенный суп", category: "soups", price: "4 пороха", image: "assets/pumpkin_soup.png" },
            { id: 6, name: "Лапшичный суп", category: "soups", price: "4 пороха", image: "assets/noodle_soup.png" },
            { id: 7, name: "Суп из стража", category: "soups", price: "6 пороха", image: "assets/guardian_soup.png" },
            { id: 8, name: "Луковый суп", category: "soups", price: "3 пороха", image: "assets/onion_soup.png" },
            { id: 9, name: "Костный бульон", category: "soups", price: "1 порох", image: "assets/bone_broth.png" },
            { id: 10, name: "Суп из цветков акации", category: "soups", price: "2 пороха", image: "assets/acacia_blossom_soup.png" },
            { id: 11, name: "Грибной суп", category: "soups", price: "2 пороха", image: "assets/mushroom_soup.png" }
        ];

        let currentCategory = 'soups';

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            const filteredItems = menuData.filter(item => item.category === currentCategory);

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.innerHTML = `
                    <div class="item-image-wrapper">
                        <img src="${item.image}" class="pixel-art" alt="${item.name}">
                    </div>
                    <div class="item-title">${item.name}</div>
                    <div class="item-price">
                        <img src="assets/gunpowder.png" class="currency-icon pixel-art" alt="Порох">
                        <span>${item.price}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function switchCategory(category) {
            currentCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderMenu();
        }

        renderMenu();
    </script>
</body>
</html>
